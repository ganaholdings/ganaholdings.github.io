name: update-investcal-data
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rates
        env:
          FINLIFE_AUTH: ${{ secrets.FINLIFE_AUTH }}
        run: python3 tools/investcal/fetch_rates.py --out investcal-data
      - name: Commit
        run: |
          git config user.name "investcal-bot"
          git config user.email "bot@ganaholdings.com"
          git add investcal-data
          git diff --cached --quiet || git commit -m "investcal-data: $(date -u +%Y-%m-%d)"
          git push
